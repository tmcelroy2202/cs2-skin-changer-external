<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D7EE7"/>
      <stop offset="100%" stop-color="#1a5cb5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Top accent line -->
  <rect width="1280" height="4" fill="url(#line)"/>

  <!-- Bottom accent line -->
  <rect y="636" width="1280" height="4" fill="#F59E0B" opacity="0.8"/>

  <!-- Subtle diagonal glow lines -->
  <g opacity="0.04">
    <line x1="200" y1="640" x2="1080" y2="0" stroke="#2D7EE7" stroke-width="1"/>
    <line x1="260" y1="640" x2="1140" y2="0" stroke="#2D7EE7" stroke-width="1"/>
  </g>

  <!-- VeneeR title -->
  <text x="60" y="240" font-family="'Segoe UI',-apple-system,sans-serif" font-size="110" font-weight="700" fill="#2D7EE7">VeneeR</text>

  <!-- Subtitle -->
  <text x="64" y="300" font-family="'Segoe UI',-apple-system,sans-serif" font-size="24" fill="#b0b0be">External Skin Changer &nbsp;·&nbsp; Counter-Strike 2</text>

  <!-- Tag line -->
  <text x="64" y="340" font-family="'Segoe UI',-apple-system,sans-serif" font-size="16" fill="#70707e">Standalone overlay &nbsp;·&nbsp; D3D11 &nbsp;·&nbsp; Dear ImGui &nbsp;·&nbsp; No injection</text>

  <!-- Version pill -->
  <rect x="60" y="370" width="110" height="36" rx="18" ry="18" fill="#F59E0B"/>
  <text x="115" y="394" font-family="'Segoe UI',-apple-system,sans-serif" font-size="16" font-weight="700" fill="#0a0a12" text-anchor="middle">v1.4.1</text>

  <!-- Repo path -->
  <text x="60" y="600" font-family="'Segoe UI',-apple-system,sans-serif" font-size="14" fill="#505060">mrch4n725 / cs2-skin-changer-external</text>
</svg>
